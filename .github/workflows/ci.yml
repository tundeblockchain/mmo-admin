name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

  e2e:
    name: E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build E2E app
        run: npm run build:e2e

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore

      - name: Check real sign-in secrets
        id: real_auth
        env:
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          E2E_FIREBASE_API_KEY: ${{ secrets.E2E_FIREBASE_API_KEY }}
          E2E_FIREBASE_AUTH_DOMAIN: ${{ secrets.E2E_FIREBASE_AUTH_DOMAIN }}
          E2E_FIREBASE_PROJECT_ID: ${{ secrets.E2E_FIREBASE_PROJECT_ID }}
          E2E_FIREBASE_APP_ID: ${{ secrets.E2E_FIREBASE_APP_ID }}
        run: |
          set +x
          missing=""
          for name in E2E_TEST_EMAIL E2E_TEST_PASSWORD E2E_FIREBASE_API_KEY E2E_FIREBASE_AUTH_DOMAIN E2E_FIREBASE_PROJECT_ID E2E_FIREBASE_APP_ID; do
            case "$name" in
              E2E_TEST_EMAIL) value="$E2E_TEST_EMAIL" ;;
              E2E_TEST_PASSWORD) value="$E2E_TEST_PASSWORD" ;;
              E2E_FIREBASE_API_KEY) value="$E2E_FIREBASE_API_KEY" ;;
              E2E_FIREBASE_AUTH_DOMAIN) value="$E2E_FIREBASE_AUTH_DOMAIN" ;;
              E2E_FIREBASE_PROJECT_ID) value="$E2E_FIREBASE_PROJECT_ID" ;;
              E2E_FIREBASE_APP_ID) value="$E2E_FIREBASE_APP_ID" ;;
            esac
            value="$(printf '%s' "$value" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            if [ -z "$value" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping real sign-in: required secrets are not set:$missing"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build real-auth E2E app
        if: steps.real_auth.outputs.skip != 'true'
        env:
          E2E_FIREBASE_API_KEY: ${{ secrets.E2E_FIREBASE_API_KEY }}
          E2E_FIREBASE_AUTH_DOMAIN: ${{ secrets.E2E_FIREBASE_AUTH_DOMAIN }}
          E2E_FIREBASE_PROJECT_ID: ${{ secrets.E2E_FIREBASE_PROJECT_ID }}
          E2E_FIREBASE_APP_ID: ${{ secrets.E2E_FIREBASE_APP_ID }}
          E2E_FIREBASE_STORAGE_BUCKET: ${{ secrets.E2E_FIREBASE_STORAGE_BUCKET }}
          E2E_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.E2E_FIREBASE_MESSAGING_SENDER_ID }}
        run: |
          set +x
          npm run build:e2e:real

      - name: Run real sign-in tests
        if: steps.real_auth.outputs.skip != 'true'
        env:
          E2E_SKIP_BUILD: '1'
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          E2E_FIREBASE_API_KEY: ${{ secrets.E2E_FIREBASE_API_KEY }}
          E2E_FIREBASE_AUTH_DOMAIN: ${{ secrets.E2E_FIREBASE_AUTH_DOMAIN }}
          E2E_FIREBASE_PROJECT_ID: ${{ secrets.E2E_FIREBASE_PROJECT_ID }}
          E2E_FIREBASE_APP_ID: ${{ secrets.E2E_FIREBASE_APP_ID }}
        run: |
          set +x
          npm run test:e2e:real

      - name: Upload real-auth Playwright report
        if: steps.real_auth.outputs.skip != 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-real-auth
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload real-auth Playwright test results
        if: steps.real_auth.outputs.skip != 'true' && failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-real-auth
          path: test-results/
          if-no-files-found: ignore
